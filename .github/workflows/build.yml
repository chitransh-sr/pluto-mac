name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Pluto.app
        run: |
          ./scripts/build.sh

      - name: Verify zero warnings
        run: |
          # Rebuild and capture all output; fail if warnings appear
          set -o pipefail
          OUTPUT=$(swiftc -O -swift-version 5 Sources/PlutoMac/*.swift -o /dev/null 2>&1 || true)
          WARNINGS=$(echo "$OUTPUT" | grep -c "warning:" || true)
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::error::Found $WARNINGS compiler warnings:"
            echo "$OUTPUT" | grep "warning:"
            exit 1
          else
            echo "✓ Zero warnings"
          fi

      - name: Verify binary
        run: |
          file out/Pluto.app/Contents/MacOS/Pluto
          test -f out/Pluto.app/Contents/Info.plist
          test -f out/Pluto.app/Contents/Resources/Pluto.icns
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" out/Pluto.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" out/Pluto.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleIconFile" out/Pluto.app/Contents/Info.plist

      - name: Run unit tests
        run: |
          swift test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pluto.app
          path: out/Pluto.app
